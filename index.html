<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEFR Certificate</title>
  <style>
    body {
      margin: 0;
      background: #f3efe6;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px;
    }
    .certificate-box {
      max-width: 900px;
      width: 100%;
      text-align: center;
    }
    .certificate-box img {
      width: 100%;
      max-width: 864px;
      height: auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.18);
    }
  </style>
</head>
<body>
  <div class="certificate-box">
    <img src="certificate.png" alt="CEFR Certificate">
  </div>
</body>
</html>
